<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T9G0J2W7JP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T9G0J2W7JP');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Finanças Pessoais na Prática</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--nav:#0D1B2E;--bg:#FFFFFF;--bg-subtle:#F7F8FA;--text:#1A1F2E;--muted:#6B7280;--border:#E5E7EB;--accent:#1B56D6;--green:#16A34A;--sidebar:268px;--header:56px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;user-select:none;-webkit-user-select:none}
    a{color:var(--accent);text-decoration:none}
    .top-bar{position:fixed;top:0;left:0;right:0;height:var(--header);background:var(--nav);display:flex;align-items:center;padding:0 20px;z-index:200;gap:16px}
    .top-bar .logo{font-family:'Georgia',serif;font-size:16px;color:#F1F5F9;font-weight:700;white-space:nowrap}
    .top-bar .sep{color:#334155;font-size:18px}
    .top-bar .book-title{font-size:13px;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .top-bar .actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .btn-sm{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;border:none;background:transparent;color:#94A3B8;border:1px solid #334155}
    .btn-sm:hover{color:#F1F5F9}
    .sidebar{position:fixed;top:var(--header);left:0;bottom:0;width:var(--sidebar);background:var(--bg-subtle);border-right:1px solid var(--border);overflow-y:auto;z-index:100;padding:16px 0 40px}
    .sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 18px;margin-bottom:6px}
    .chapter-link{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:12.5px;color:var(--text);cursor:pointer;transition:background .1s;border:none;background:none;width:100%;text-align:left;font-family:inherit;line-height:1.35}
    .chapter-link:hover{background:var(--border)}
    .chapter-link.active{background:#EFF6FF;color:var(--accent);font-weight:600}
    .chapter-link .num{font-size:10px;color:var(--muted);width:18px;flex-shrink:0;text-align:right}
    .chapter-link.active .num{color:var(--accent)}
    .content{margin-left:var(--sidebar);padding-top:var(--header);min-height:100vh}
    .content-inner{max-width:680px;margin:0 auto;padding:48px 40px 80px}
    .chapter-header{margin-bottom:32px}
    .chapter-tag{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .chapter-title{font-family:'Merriweather',Georgia,serif;font-size:26px;font-weight:700;line-height:1.25;color:var(--text)}
    .chapter-section h3{font-family:'Merriweather',Georgia,serif;font-size:17px;font-weight:700;margin:28px 0 12px;line-height:1.3;color:var(--text)}
    .chapter-section p{font-size:16px;line-height:1.8;color:#374151;margin-bottom:14px}
    .chapter-section strong{color:var(--text)}
    .chapter-section ul,.chapter-section ol{margin:0 0 14px 20px}
    .chapter-section li{font-size:15px;line-height:1.7;color:#374151;margin-bottom:6px}
    .highlight-box{background:#EFF6FF;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:14px 18px;margin:18px 0}
    .highlight-box p{margin:0;font-size:15px;color:#1e3a8a;line-height:1.6}
    .tip-box{background:#F0FDF4;border-left:3px solid var(--green);border-radius:0 6px 6px 0;padding:14px 18px;margin:18px 0}
    .tip-box p{margin:0;font-size:15px;color:#166534;line-height:1.6}
    .warning-box{background:#FFFBEB;border-left:3px solid #F59E0B;border-radius:0 6px 6px 0;padding:14px 18px;margin:18px 0}
    .warning-box p{margin:0;font-size:15px;color:#78350F;line-height:1.6}
    .danger-box{background:#FEF2F2;border-left:3px solid #EF4444;border-radius:0 6px 6px 0;padding:14px 18px;margin:18px 0}
    .danger-box p{margin:0;font-size:15px;color:#991B1B;line-height:1.6}
    table.spec{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px}
    table.spec th{background:var(--bg-subtle);text-align:left;padding:9px 12px;font-weight:600;border:1px solid var(--border)}
    table.spec td{padding:9px 12px;border:1px solid var(--border);vertical-align:top;line-height:1.5}
    table.spec tr:nth-child(even) td{background:var(--bg-subtle)}
    .chapter-nav{display:flex;justify-content:space-between;margin-top:48px;padding-top:20px;border-top:1px solid var(--border)}
    .chapter-nav a{font-size:13px;color:var(--accent);font-weight:500;cursor:pointer}
    .chapter-nav a:hover{text-decoration:underline}
    @media(max-width:720px){.sidebar{display:none}.content{margin-left:0}.content-inner{padding:28px 18px 60px}.chapter-title{font-size:21px}}
  
    .review-btn{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:300;transition:background .15s}
    .review-btn:hover{background:var(--accent-hover)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:12px;padding:32px;max-width:420px;width:100%}
    .modal h3{font-size:18px;font-weight:700;margin-bottom:6px}
    .modal p{font-size:14px;color:var(--muted);margin-bottom:20px}
    .stars-input{display:flex;gap:6px;margin-bottom:16px;font-size:32px;cursor:pointer}
    .stars-input span{color:#E5E7EB;transition:color .1s;user-select:none}
    .stars-input span.on{color:#F59E0B}
    .modal label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
    .modal input,.modal textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;margin-bottom:12px}
    .modal textarea{height:90px;resize:none}
    .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn-enviar{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-enviar:hover{background:var(--accent-hover)}
    .btn-enviar:disabled{background:#9CA3AF;cursor:not-allowed}
    .btn-fechar{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
    .review-ok{text-align:center;padding:20px 0;display:none}
    .review-ok .check{font-size:48px;margin-bottom:12px}
  </style>
</head>
<body>

<div id="watermark" style="position:fixed;opacity:0;pointer-events:none;font-size:1px;color:transparent;z-index:-1"></div>

<div class="top-bar">
  <span class="logo">O Analista Finanças</span>
  <span class="sep">›</span>
  <span class="book-title">Finanças Pessoais na Prática</span>
  <div class="actions">
    <button class="btn-sm" onclick="window.location.href='home.html'">← Loja</button>
    <button class="btn-sm" onclick="sair()">Sair</button>
  </div>
</div>

<nav class="sidebar" id="sidebar">
  <p class="sidebar-label" style="margin-top:8px">Conteúdo</p>
  <button class="chapter-link active" id="nav-0" onclick="showChapter(0)"><span class="num">—</span>Introdução</button>
  <button class="chapter-link" id="nav-1" onclick="showChapter(1)"><span class="num">1</span>Cartão de crédito como estratégia</button>
  <button class="chapter-link" id="nav-2" onclick="showChapter(2)"><span class="num">2</span>Reserva de Oportunidade</button>
  <button class="chapter-link" id="nav-3" onclick="showChapter(3)"><span class="num">3</span>Dicionário do Iniciante</button>
  <button class="chapter-link" id="nav-4" onclick="showChapter(4)"><span class="num">4</span>Reserva de Emergência</button>
  <button class="chapter-link" id="nav-5" onclick="showChapter(5)"><span class="num">5</span>Triângulo dos Investimentos</button>
  <button class="chapter-link" id="nav-6" onclick="showChapter(6)"><span class="num">6</span>LCI e LCA: Renda Fixa de verdade</button>
  <button class="chapter-link" id="nav-7" onclick="showChapter(7)"><span class="num">7</span>Mentalidade de Ferro</button>
  <button class="chapter-link" id="nav-8" onclick="showChapter(8)"><span class="num">8</span>Fundos Imobiliários (FIIs)</button>
  <button class="chapter-link" id="nav-9" onclick="showChapter(9)"><span class="num">9</span>Checklist do FII</button>
  <button class="chapter-link" id="nav-10" onclick="showChapter(10)"><span class="num">10</span>Ações: virar sócio de empresas</button>
  <button class="chapter-link" id="nav-11" onclick="showChapter(11)"><span class="num">11</span>Checklist da Ação</button>
  <button class="chapter-link" id="nav-12" onclick="showChapter(12)"><span class="num">12</span>Setores Perenes vs. Commodities</button>
  <button class="chapter-link" id="nav-13" onclick="showChapter(13)"><span class="num">13</span>Criptomoedas na carteira</button>
  <button class="chapter-link" id="nav-14" onclick="showChapter(14)"><span class="num">14</span>Internacional: Stocks, REITs e ETFs</button>
  <button class="chapter-link" id="nav-15" onclick="showChapter(15)"><span class="num">15</span>Minha estrutura de carteira</button>
</nav>

<main class="content">
  <div class="content-inner" id="chapter-content"><p style="color:var(--muted)">Carregando…</p></div>
</main>

<script>
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey) && ['c','a','p','s','u','i'].includes(e.key.toLowerCase())) { e.preventDefault(); return false; }
    if (e.key==='F12') e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  let C = {};

  function sair() {
    fetch('/api/logout', { method: 'POST' }).finally(() => window.location.href = 'home.html');
  }

  // O conteúdo só é entregue pelo servidor para quem tem sessão válida e compra aprovada
  fetch('/api/content?produto=financas', { credentials: 'same-origin', cache: 'no-store' })
    .then(r => {
      if (r.status === 401 || r.status === 403) { window.location.href = 'login.html'; throw 'redirect'; }
      if (!r.ok) throw 'erro';
      return r.json();
    })
    .then(data => {
      C = data.chapters;
      document.getElementById('watermark').textContent = data.watermark;
      showChapter(0);
    })
    .catch(e => {
      if (e === 'redirect') return;
      document.getElementById('chapter-content').innerHTML =
        '<p style="color:var(--muted)">Não foi possível carregar o conteúdo. Recarregue a página.</p>';
    });

  function showChapter(n) {
    const ch = C[n];
    document.querySelectorAll('.chapter-link').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-'+n).classList.add('active');
    const prev = ch.prev !== null ? `<a onclick="showChapter(${ch.prev})">← Anterior</a>` : '<span></span>';
    const next = ch.next !== null ? `<a onclick="showChapter(${ch.next})">Próximo →</a>` : '<span></span>';
    document.getElementById('chapter-content').innerHTML = `
      <div class="chapter-header">
        <div class="chapter-tag">${ch.tag}</div>
        <h1 class="chapter-title">${ch.title}</h1>
      </div>
      <div class="chapter-section">${ch.html}</div>
      <div class="chapter-nav">${prev}${next}</div>`;
    window.scrollTo(0,0);
  }

</script>

<button class="review-btn" onclick="abrirModal()">⭐ Avaliar este ebook</button>

<div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal">
    <button class="btn-fechar" onclick="fecharModal()">✕</button>
    <h3>Deixe sua avaliação</h3>
    <p>Sua opinião ajuda outras pessoas a conhecerem o ebook.</p>

    <div class="review-ok" id="review-ok">
      <div class="check">🎉</div>
      <strong>Obrigado pelo feedback!</strong>
      <p style="margin-top:8px;color:var(--muted);font-size:14px">Sua avaliação será publicada após revisão.</p>
    </div>

    <div id="review-form">
      <div class="stars-input" id="stars">
        <span onclick="setRating(1)">★</span>
        <span onclick="setRating(2)">★</span>
        <span onclick="setRating(3)">★</span>
        <span onclick="setRating(4)">★</span>
        <span onclick="setRating(5)">★</span>
      </div>
      <div class="row">
        <div><label>Seu nome</label><input type="text" id="rev-author" placeholder="João Silva"></div>
        <div><label>Cidade (opcional)</label><input type="text" id="rev-city" placeholder="São Paulo, SP"></div>
      </div>
      <label>Seu comentário</label>
      <textarea id="rev-text" placeholder="O que você achou do ebook?"></textarea>
      <button class="btn-enviar" id="btn-enviar-rev" onclick="enviarReview()">Enviar avaliação</button>
    </div>
  </div>
</div>

<script>
  let rating = 5;
  setRating(5);

  function setRating(n) {
    rating = n;
    document.querySelectorAll('#stars span').forEach((s, i) => {
      s.classList.toggle('on', i < n);
    });
  }

  function abrirModal() { document.getElementById('modal-overlay').classList.add('show'); }

  function fecharModal(e) {
    if (!e || e.target === document.getElementById('modal-overlay') || e.target.classList.contains('btn-fechar')) {
      document.getElementById('modal-overlay').classList.remove('show');
    }
  }

  async function enviarReview() {
    const author = document.getElementById('rev-author').value.trim();
    const text   = document.getElementById('rev-text').value.trim();
    if (!author || !text) { alert('Preencha seu nome e o comentário.'); return; }

    const btn = document.getElementById('btn-enviar-rev');
    btn.disabled    = true;
    btn.textContent = 'Enviando…';

    try {
      const res  = await fetch('/api/reviews', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          product_id: 'financas',
          author,
          city:   document.getElementById('rev-city').value.trim(),
          rating,
          text
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      document.getElementById('review-form').style.display = 'none';
      document.getElementById('review-ok').style.display   = 'block';
    } catch (e) {
      btn.disabled    = false;
      btn.textContent = 'Enviar avaliação';
      alert('Erro ao enviar: ' + e.message);
    }
  }
</script>
</body>
</html>
